# Options for every ripples instance started through the systemd service.
# Does not apply to instances started manually from the command line.
#
# Raise the window while the chatter continues, lower it if genuine double taps start getting
# swallowed. The lowest I was able to get by double-tapping a laptop(!) key with two fingers is
# 64ms, and the lowest I was able to get with one finger on the same keyboard is 93ms.

#RIPPLES_ARGS=-w 35
#RIPPLES_ARGS=-w 35 --exclude-keys W,A,S,D
#RIPPLES_ARGS=-m defer
